        // Micro-interaction for the GitHub button hover lift
        const ghButton = document.querySelector('button.bg-brand-600');
        if (ghButton) {
            ghButton.addEventListener('mouseenter', () => {
                ghButton.style.transform = 'translateY(-2px)';
                ghButton.style.boxShadow = '0 10px 15px -3px rgba(124, 58, 237, 0.3)';
            });
            ghButton.addEventListener('mouseleave', () => {
                ghButton.style.transform = 'translateY(0)';
                ghButton.style.boxShadow = 'none';
            });
        }

        // Subtle parallax on the background dots
        document.addEventListener('mousemove', (e) => {
            const amount = 10;
            const x = (e.clientX / window.innerWidth - 0.5) * amount;
            const y = (e.clientY / window.innerHeight - 0.5) * amount;
            document.body.style.backgroundPosition = `${x}px ${y}px`;
        });
