spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/codebaseqa
    username: postgres
    password: postgres
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.codebaseqa: DEBUG
    org.springframework.test: INFO
